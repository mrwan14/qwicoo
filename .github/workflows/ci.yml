name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder only: the build needs a value, never a real backend or secret.
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      API_BASE_URL: https://api.example.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS: the test script relies on --experimental-strip-types (22.6+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Webpack build, not the Turbopack `npm run build`, which fails on Google fonts.
      - name: Build
        run: npx next build
